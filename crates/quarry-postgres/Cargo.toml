[package]
name = "quarry-postgres"
description = "PostgreSQL driver for Quarry"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
quarry-core.workspace = true
anyhow.workspace = true
arrow.workspace = true
log.workspace = true

futures-util = { version = "0.3", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = "0.14"
webpki-roots = "1"
