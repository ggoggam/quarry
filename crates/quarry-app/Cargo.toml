[package]
name = "quarry-app"
description = "Quarry: a fast, native SQL client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "quarry"
path = "src/main.rs"

[dependencies]
quarry-core.workspace = true
quarry-duckdb.workspace = true
quarry-sqlite.workspace = true
quarry-mysql.workspace = true
quarry-clickhouse.workspace = true
quarry-postgres.workspace = true
anyhow.workspace = true
# Local times in the Output view and the query history.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
env_logger.workspace = true
flume.workspace = true
gpui-kit.workspace = true
# Every Lucide icon, on the same GPUI (gpui-pre 0.3.12) as gpui-kit; it has no
# feature to embed only some of them.
gpui-icons = "0.7.0"
log.workspace = true
# The editor's completion menu speaks LSP types; the same version gpui-kit's
# input already builds with, so nothing new is compiled.
lsp-types = "0.97"
# Updates: the GitHub release feed, its checksums, and where a skipped release is remembered.
dirs = "6"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile.workspace = true
# Saved connections: passwords in the macOS Keychain or the Secret Service.
keyring = "4"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
