[package]
name = "quarry-app"
description = "Quarry: a fast, native SQL client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "quarry"
path = "src/main.rs"

[dependencies]
quarry-core.workspace = true
quarry-duckdb.workspace = true
quarry-sqlite.workspace = true
quarry-mysql.workspace = true
quarry-clickhouse.workspace = true
quarry-postgres.workspace = true
anyhow.workspace = true
env_logger.workspace = true
flume.workspace = true
gpui-kit.workspace = true
log.workspace = true
# Updates: the GitHub release feed, its checksums, and where a skipped release is remembered.
dirs = "6"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile.workspace = true
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
