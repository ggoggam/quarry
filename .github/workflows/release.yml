name: Release

# Builds Quarry for macOS (universal .dmg) and Linux (x86_64 and aarch64 tarballs) from a v* tag
# and publishes them as a GitHub release. Tag release starts this after a version bump lands on
# main; it can also be run by hand from a tag ("Use workflow from" > the tag).
#
# macOS signing is optional. With the MACOS_DEVELOPER_ID_P12_BASE64 and
# MACOS_DEVELOPER_ID_P12_PASSWORD secrets (a "Developer ID Application" certificate and its key,
# exported as .p12), the app is signed with the hardened runtime, and with the App Store Connect
# key secrets (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64) the .dmg is notarized and stapled.
# Without them the app is signed ad hoc and the release notes say Gatekeeper will block it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_ENV: ci
  MISE_LOCKED: "true"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Check the tag matches Cargo.toml
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != tag ] || [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Run Release from a v* tag, not $GITHUB_REF."
            exit 1
          fi
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: macos
    needs: check
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve mise version from mise.toml
        id: mise_version
        run: echo "version=$(sed -n 's/^min_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@v5
        with:
          version: ${{ steps.mise_version.outputs.version }}
          install_args: --locked

      - name: Install the toolchain for both architectures
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-macos-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-macos-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Build a universal binary
        run: |
          set -euo pipefail
          cargo build --release --locked -p quarry-app --target aarch64-apple-darwin
          cargo build --release --locked -p quarry-app --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/quarry \
            target/aarch64-apple-darwin/release/quarry \
            target/x86_64-apple-darwin/release/quarry
          lipo -info target/universal/quarry

      - name: Bundle Quarry.app
        env:
          QUARRY_BINARY: target/universal/quarry
          QUARRY_BUNDLE_DIR: target/universal
        run: script/bundle-macos.sh release

      - name: Import the Developer ID certificate
        id: cert
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ]; then
            echo "No Developer ID certificate: the app will be signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::The .p12 holds no Developer ID Application identity."
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Sign, package and notarize
        env:
          MACOS_SIGNING_IDENTITY: ${{ steps.cert.outputs.identity }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$ASC_KEY_P8_BASE64" ]; then
            export ASC_KEY_PATH="$RUNNER_TEMP/asc-key.p8"
            echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          fi
          mkdir -p dist
          script/sign-macos.sh target/universal/Quarry.app "dist/Quarry-$VERSION-macos-universal.dmg"
          rm -f "$RUNNER_TEMP/asc-key.p8"
          if [ -n "$MACOS_SIGNING_IDENTITY" ]; then echo signed > dist/.macos-signing; else echo adhoc > dist/.macos-signing; fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/
          include-hidden-files: true
          if-no-files-found: error

  linux:
    name: linux-${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve mise version from mise.toml
        id: mise_version
        run: echo "version=$(sed -n 's/^min_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@v5
        with:
          version: ${{ steps.mise_version.outputs.version }}
          install_args: --locked

      - name: Install GPUI system libraries
        run: script/install-linux-deps.sh

      - name: Install the toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-linux-${{ matrix.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-linux-${{ matrix.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Build and package
        run: |
          set -euo pipefail
          cargo build --release --locked -p quarry-app
          name="quarry-$VERSION-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/quarry LICENSE README.md "dist/$name/"
          cp assets/fonts/jetbrains-mono/OFL.txt "dist/$name/JetBrainsMono-OFL.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: [check, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          signing="$(cat .macos-signing)"
          rm .macos-signing
          sha256sum -- * > SHA256SUMS
          notes="$RUNNER_TEMP/notes.md"
          if [ "$signing" = adhoc ]; then
            cat > "$notes" <<'NOTES'
          > [!NOTE]
          > The macOS build is not signed with a Developer ID or notarized yet, so macOS blocks it on
          > first launch. Open it once, then allow it in System Settings > Privacy & Security >
          > Open Anyway.

          NOTES
            sed -i 's/^          //' "$notes"
          else
            : > "$notes"
          fi
          # The notes list the pull requests merged since the previous tag; edit them on GitHub
          # afterwards if they need more.
          gh release create "$TAG" --verify-tag --generate-notes --notes-file "$notes" \
            --title "Quarry $VERSION" -- *
